# Netlify Configuration for Jason's Landscaping Business System
# Optimized for React app with Turso database integration

[build]
  # Build configuration
  publish = "build"
  command = "npm run build"
  
  # Environment variables for build process
  environment = { NODE_VERSION = "18" }

[build.processing]
  # Optimize for mobile performance
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Redirect configuration for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Performance headers
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/static/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment-specific configurations
[context.production]
  # Production-specific build settings
  command = "npm run build"
  
  # Production environment variables (set these in Netlify dashboard)
  # REACT_APP_TURSO_DATABASE_URL = "your-production-database-url"
  # REACT_APP_TURSO_AUTH_TOKEN = "your-production-auth-token"
  # REACT_APP_ENVIRONMENT = "production"

[context.deploy-preview]
  # Deploy preview settings
  command = "npm run build"
  
[context.branch-deploy]
  # Branch deploy settings
  command = "npm run build"

# Edge Functions configuration (if needed for advanced features)
# [[edge_functions]]
#   function = "database-sync"
#   path = "/api/sync"

# Functions configuration (for serverless functions if needed)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Dev server configuration for local development
[dev]
  command = "npm start"
  port = 3001
  targetPort = 3000
  autoLaunch = false